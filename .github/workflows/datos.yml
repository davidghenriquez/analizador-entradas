name: Actualizar datos y modelos

on:
  schedule:
    - cron: '30 22 * * 1-5'   # de lunes a viernes, tras el cierre de EE. UU.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/actualizar-datos.mjs
      - run: node scripts/entrenar-modelos.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Datos de mercado actualizados"
          git push
